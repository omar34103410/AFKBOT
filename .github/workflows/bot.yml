name: Minecraft Bot

on:
  workflow_dispatch:        # تشغيل يدوي من تبويب Actions
  schedule:
    - cron: '0 */6 * * *'   # إعادة التشغيل كل 6 ساعات

concurrency:
  group: mc-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies quickly
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Run bot
        run: timeout 350m node index.js || true
        env:
          MC_HOST: "easyplay.aternos.me"    
          MC_USER: "AFKBOT"            
          MC_PORT: "62029"
          MC_VERSION: "1.20.4"
          MC_AUTH: "offline"        # وضع الكراك الإلزامي
          MC_PASSWORD: "pinkpin123"
