name: Run AFK Bot

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run bot
        env:
          SERVER_HOST: easyplay.aternos.me
          SERVER_PORT: 62029
          BOT_USERNAME: AFKBOT
          # BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: node index.js
